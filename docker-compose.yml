version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: cipherconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cipherconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - cipherconnect_pgdata:/var/lib/postgresql/data

volumes:
  cipherconnect_pgdata:
